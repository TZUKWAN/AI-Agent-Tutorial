   </g>
   <g id="text_29">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: start; fill: #222222" x="678.01365" y="457.656843" transform="rotate(-0 678.01365 457.656843)">输出/结果</text>
