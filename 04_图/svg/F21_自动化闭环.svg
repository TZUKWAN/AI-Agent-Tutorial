   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #222222" x="383.85" y="31.596895" transform="rotate(-0 383.85 31.596895)">F21  工作流拆解：以「每日竞品价格监控」为例</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #9a7b3f" x="383.85" y="62.10201" transform="rotate(-0 383.85 62.10201)">真实案例：每天自动抓 3 家竞品价格，变动超阈值才推送，调价建议需人审批</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #58727d" x="157.86" y="140.002802" transform="rotate(-0 157.86 140.002802)">Trigger</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #333333" x="157.86" y="155.015041" transform="rotate(-0 157.86 155.015041)">触发 · 事件/动作</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(126.889453 180.349277)">定时到点 08:00</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(99.36 193.635176)">（也可改成：竞品页更新时）</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #63758a" x="383.85" y="140.002914" transform="rotate(-0 383.85 140.002914)">Schedule</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #333333" x="383.85" y="155.050979" transform="rotate(-0 383.85 155.050979)">调度 · 什么时候跑</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(355.140703 180.606621)">cron: 0 8 * * *</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(347.85 193.77791)">工作日跑，周末停</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #9a7b3f" x="609.84" y="140.002914" transform="rotate(-0 609.84 140.002914)">Condition</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #333333" x="609.84" y="155.019354" transform="rotate(-0 609.84 155.019354)">条件 · 满足才执行</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(579.196406 180.344355)">价格变动 ≥ 5%</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(587.34 193.787051)">或新品上架</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #7b6a9a" x="157.86" y="271.950114" transform="rotate(-0 157.86 271.950114)">Action</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #333333" x="157.86" y="286.998179" transform="rotate(-0 157.86 286.998179)">动作 · 执行任务</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(109.394297 312.322493)">抓 3 家价格 → 对比昨日</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(114.527109 325.734251)">→ 生成对比表 + 建议</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #5a8a55" x="383.85" y="271.950226" transform="rotate(-0 383.85 271.950226)">Notification</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #333333" x="383.85" y="286.98021" transform="rotate(-0 383.85 286.98021)">通知 · 告诉人结果</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(354.299063 312.296477)">IM 推送给运营</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(356.85 325.720891)">无变化则静默</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #b44948" x="609.84" y="271.950114" transform="rotate(-0 609.84 271.950114)">Human Approval</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #333333" x="609.84" y="287.006804" transform="rotate(-0 609.84 287.006804)">人工审批 · 关键节点人确认</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(553.176563 312.318274)">调价建议 → 运营点「同意」</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; fill: #444444" transform="translate(573.84 325.777845)">才回写到自家后台</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #6b7280" x="609.84" y="207.748466" transform="rotate(-0 609.84 207.748466)">不满足 → 静默</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #b44948" x="383.85" y="393.6168" transform="rotate(-0 383.85 393.6168)">拆解任何一个自动化工作流，都先把这 6 个字段填出来——填不出，就还不能自动化</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #444444" x="383.85" y="421.8912" transform="rotate(-0 383.85 421.8912)">其中 Human Approval 是「不可逆动作」的安全闸门：不是每次都要人，是关键节点必须人</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: start; fill: #222222" x="113.03865" y="457.633093" transform="rotate(-0 113.03865 457.633093)">输入/原始</text>
   </g>
   <g id="text_25">
