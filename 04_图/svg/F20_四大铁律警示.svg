   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #222222" x="369.9" y="30.479189" transform="rotate(-0 369.9 30.479189)">F20  四大铁律（违反任何一条都可能出事）</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: start; fill: #b44948" x="72.486" y="135.8208" transform="rotate(-0 72.486 135.8208)">铁律一</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #b44948" x="203.058" y="135.8208" transform="rotate(-0 203.058 135.8208)">不编造证据</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #5a3030" x="203.058" y="180.1728" transform="rotate(-0 203.058 180.1728)">引用、数据、结果必须可溯源；查不到就说查不到</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: start; fill: #b44948" x="406.17" y="135.8208" transform="rotate(-0 406.17 135.8208)">铁律二</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #b44948" x="536.742" y="135.8208" transform="rotate(-0 536.742 135.8208)">先跑起来再改</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #5a3030" x="536.742" y="180.1728" transform="rotate(-0 536.742 180.1728)">不要凭想象改代码；先复现问题，再小步修</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: start; fill: #b44948" x="72.486" y="286.6176" transform="rotate(-0 72.486 286.6176)">铁律三</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #b44948" x="203.058" y="286.6176" transform="rotate(-0 203.058 286.6176)">危险动作先问人</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #5a3030" x="203.058" y="330.9696" transform="rotate(-0 203.058 330.9696)">删除、覆盖、对外发送、花钱——停下来等确认</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: start; fill: #b44948" x="406.17" y="286.6176" transform="rotate(-0 406.17 286.6176)">铁律四</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #b44948" x="536.742" y="286.6176" transform="rotate(-0 536.742 286.6176)">每步留快照</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #5a3030" x="536.742" y="330.9696" transform="rotate(-0 536.742 330.9696)">Git/备份/检查点；出问题能回到上一个好状态</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', sans-serif; text-anchor: middle; fill: #444444" x="369.9" y="415.2384" transform="rotate(-0 369.9 415.2384)">这四条不依赖具体工具，换任何平台都成立</text>
   </g>
